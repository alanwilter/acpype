[project]
name = "acpype"
version = "2026.9.2"
description = "ACPYPE - AnteChamber PYthon Parser interfacE"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Alan Silva", email = "alanwilter@gmail.com" }]
keywords = ["acpype", "amber", "gromacs"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["openbabel-wheel>=3.1.1.19"]

[project.urls]
"Bug Tracker" = "https://github.com/alanwilter/acpype/issues"
DOI = "https://doi.org/10.1186/1756-0500-5-367"
Docs = "https://acpype.readthedocs.io"
Homepage = "https://alanwilter.github.io/acpype/"
Repository = "https://github.com/alanwilter/acpype"
Wiki = "https://github.com/alanwilter/acpype/wiki"

[project.scripts]
acpype = "acpype.cli:init_main"

[dependency-groups]
dev = [
  "ipdb>=0.13.13",
  "pdbpp>=0.11.6",
  "pre-commit>=4.1",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "pytest-random-order>=1.1",
  "pytest-xdist>=3.6",
  "ruff>=0.9",
  "ty>=0.0.77",
  "wheel>=0.45",
]
docs = [
  "doc8>=1.1.2",
  "esbonio>=0.16.5",
  "rstcheck>=6.2.4",
  "sphinx>=8.1",
  "sphinx-rtd-theme>=3.0",
]

[build-system]
requires = ["uv_build>=0.9.0,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "--durations=5"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120
# `acpype/amber_*` is vendored AmberTools; it must never be linted or reformatted.
extend-exclude = ["acpype/amber_linux", "acpype/amber_macos", "legacy"]

[tool.ruff.lint]
# Pinned explicitly rather than via extend-select: ruff's implicit default rule set
# has grown substantially, and an explicit list keeps upgrades from silently
# introducing hundreds of new findings. Broadening this is a deliberate, separate step.
select = ["E4", "E7", "E9", "F", "UP", "RUF", "I"]
# UP031 (printf-style formatting) flags ~150 sites, most of them inside the routines
# that emit GROMACS/AMBER topology files. Rewriting those mechanically risks silently
# corrupting output, so it is deliberately deferred to its own reviewed change.
ignore = ["UP031"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
# Vendored AmberTools, the retired CCPN bridge, and the conda recipe are not ours to check.
exclude = ["acpype/amber_linux", "acpype/amber_macos", "legacy", "recipe"]

[tool.uv]
default-groups = ["dev"]

[tool.uv.build-backend]
# Flat layout: the `acpype` package lives at the repository root, not under src/.
module-root = ""
module-name = "acpype"
# The package ships ~110 MB of AmberTools binaries, so everything under acpype/
# is included by default. Guard against local tool caches leaking into a release.
source-exclude = ["**/.DS_Store", "**/.mypy_cache", "**/.pytest_cache", "**/.ruff_cache"]
wheel-exclude = ["**/.DS_Store", "**/.mypy_cache", "**/.pytest_cache", "**/.ruff_cache"]
