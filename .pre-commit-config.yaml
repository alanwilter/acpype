# Vendored AmberTools and the retired CCPN bridge are upstream content: no hook
# may rewrite them, or a re-vendor silently diverges from what AmberTools ships.
exclude: ^(src/acpype/amber_(linux|macos)/|legacy/)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
        # AmberTools 26 bundles libicudata (~32 MB), pulled in by conda's libxml2,
        # which libnetcdf and therefore teLeap link against.
        args: ["--maxkb=34000"]
      - id: debug-statements
  # ruff runs from uv.lock, like ty, rather than from astral-sh/ruff-pre-commit. That
  # repo's rev is moved by `pre-commit autoupdate`, which always takes the newest tag,
  # and pip's 7-day `uploaded-prior-to` cooldown then refuses to install it. The lock
  # already honours `exclude-newer = "7 days"`, so `just qa` and the hooks share a ruff.
  # Entries and file types mirror the upstream hooks.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: ty
        name: ty
        entry: uv run ty check
        language: system
        types: [python]
        pass_filenames: false
      - id: ver_today
        name: ver_today
        entry: ./scripts/ver_today.sh
        language: system
        require_serial: true
