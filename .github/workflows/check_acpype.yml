name: check_acpype

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/check_acpype.yml"
  # Lets the suite be run against any branch from the Actions tab, without a PR,
  # and doubles as the recovery path for publishing a tag that already exists.
  workflow_dispatch:
    inputs:
      publish_tag:
        description: "Publish this existing tag instead of running the suite, e.g. 2026.9.2"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only ever cancel superseded PR runs. Releases now happen inside this workflow, so
  # cancelling a main or dispatch run could kill it midway through a PyPI upload.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-test:
    # A publish-only dispatch targets a tag that already passed the suite on main.
    if: inputs.publish_tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Codecov uploads over OIDC rather than a stored token; job-level permissions
      # replace the defaults, so contents has to be repeated here.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # setup-uv stopped maintaining floating major tags after v7, so this is
        # pinned to an exact release; Dependabot keeps it current.
        uses: astral-sh/setup-uv@v10.0.1
        with:
          # Version comes from `required-version` in pyproject.toml.
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set Env
        run: |
          echo "PYTEST_ADDOPTS=--random-order" >> $GITHUB_ENV
          echo "DEBIAN_FRONTEND=noninteractive" >> $GITHUB_ENV
          echo "AMBERHOME=$PWD/src/acpype/amber_linux" >> $GITHUB_ENV
          echo "$PWD/src/acpype/amber_linux/bin" >> $GITHUB_PATH

      - name: Install system dependencies
        # Libraries the vendored AmberTools bundle deliberately takes from the host
        # (see SYSTEM_LIBS_LINUX in scripts/vendor_amber.py), plus the X11 bits
        # openbabel-wheel needs.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tzdata libgfortran5 libstdc++6 libgomp1 libblas3 liblapack3 \
            libcurl4 libxrender1 libxext6 libsm6

      - name: Install project
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Check the vendored AmberTools bundle loads
        run: |
          which antechamber
          uv run python scripts/check_amber_bundle.py src/acpype/amber_linux

      - name: Run Ruff
        run: |
          uv run ruff check --output-format=github .
          uv run ruff format --check .

      - name: Type check with ty
        run: uv run ty check

      - name: Audit dependencies
        run: uv audit

      - name: Test with PyTest
        # Coverage flags live in [tool.pytest] addopts, including fail_under.
        run: uv run pytest --color=yes

      - name: Check platform wheels build and stay under the PyPI size limit
        if: matrix.python-version == '3.12'
        run: uv run python scripts/build_dists.py --out-dir dist

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: false
          use_oidc: true

  release:
    needs: check-test
    # Only for real pushes: the magic words live in the head commit message.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Read the version to release
        id: version
        # The tag comes from the committed version, never from `date`. ver_today.sh
        # stamps the source at commit time using the *local* date while this runner is
        # on UTC, so recomputing it here disagrees whenever a commit lands near
        # midnight. pyproject is the authority because it is what the wheel is built
        # from; publish-pypi then checks acpype.__version__ against the tag, which
        # catches the two files drifting apart.
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          echo "version: ${version}"
          if ! printf '%s' "${version}" | grep -qE '^[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2}$'; then
            echo "::error::version ${version} is not a YYYY.M.D release version"
            exit 1
          fi
          echo "tag=${version}" >> $GITHUB_OUTPUT

      - name: Create tag
        # will only create a new tag if the commit message contains 'new_tag' on main
        if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'new_tag')
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: "refs/tags/${{ steps.version.outputs.tag }}",
              sha: context.sha
            })

      - name: Create Release
        # will only create a new release if the commit message contains 'new_release' on main
        if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'new_release')
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: false

  publish-pypi:
    # Inlined rather than kept in a reusable workflow on purpose. PyPI authenticates
    # the OIDC token against `job_workflow_ref` but verifies the PEP 740 attestation
    # against the certificate's Build Config URI, which always names the *entry-point*
    # workflow. Behind a `workflow_call` those two claims name different files, so one
    # check or the other must fail. Publishing from here keeps them identical.
    #
    # The trusted publisher on PyPI is therefore check_acpype.yml + environment pypi.
    needs: [release]
    if: >-
      always()
      && (
        (
          github.event_name == 'push'
          && needs.release.result == 'success'
          && github.ref == 'refs/heads/main'
          && contains(github.event.head_commit.message, 'new_release')
        )
        || (github.event_name == 'workflow_dispatch' && inputs.publish_tag != '')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: pypi
      url: https://pypi.org/p/acpype
    permissions:
      # contents for the checkout and the Release upload, id-token for OIDC.
      contents: write
      id-token: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Resolve the tag to publish
        id: tag
        run: echo "tag=${{ inputs.publish_tag || needs.release.outputs.tag }}" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          # Version comes from `required-version` in pyproject.toml.
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install project
        run: uv sync --locked

      - name: Check the version matches the tag
        run: |
          version=$(uv run python -c "import acpype; print(acpype.__version__)")
          echo "package version: ${version}   tag: ${{ steps.tag.outputs.tag }}"
          if [ "${version}" != "${{ steps.tag.outputs.tag }}" ]; then
            echo "::error::package version ${version} does not match tag ${{ steps.tag.outputs.tag }}"
            exit 1
          fi

      - name: Build the distributions
        # Two platform wheels plus a slim sdist: a combined wheel is ~129 MB and a full
        # sdist ~121 MB, both over PyPI's 100 MB per-file limit. The script fails if
        # anything creeps back over it.
        run: uv run python scripts/build_dists.py --out-dir dist

      - name: List distributions
        run: ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Attach the distributions to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.tag.outputs.tag }}" dist/* --clobber

  publish-docker:
    # After PyPI, so a release that failed to publish leaves no image behind.
    needs: [publish-pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: dockerhub
      url: https://hub.docker.com/r/acpype/acpype
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.publish-pypi.outputs.tag }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        # Docker Hub has no OIDC equivalent, so this one needs stored credentials.
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          # The vendored AmberTools is linux x86_64 only.
          platforms: linux/amd64
          push: true
          tags: |
            acpype/acpype:latest
            acpype/acpype:${{ needs.publish-pypi.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
