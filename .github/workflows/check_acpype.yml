name: check_acpype

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    paths:
      - "acpype/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/check_acpype.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set Env
        run: |
          echo "PYTEST_ADDOPTS=--random-order" >> $GITHUB_ENV
          echo "DEBIAN_FRONTEND=noninteractive" >> $GITHUB_ENV
          echo "AMBERHOME=$PWD/acpype/amber_linux" >> $GITHUB_ENV
          echo "$PWD/acpype/amber_linux/bin" >> $GITHUB_PATH

      - name: Install system dependencies
        # Libraries the vendored AmberTools bundle deliberately takes from the host
        # (see SYSTEM_LIBS_LINUX in scripts/vendor_amber.py), plus the X11 bits
        # openbabel-wheel needs.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tzdata libgfortran5 libstdc++6 libgomp1 libblas3 liblapack3 \
            libcurl4 libxrender1 libxext6 libsm6

      - name: Install project
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Check the vendored AmberTools bundle loads
        run: |
          which antechamber
          uv run python scripts/check_amber_bundle.py acpype/amber_linux

      - name: Run Ruff
        run: |
          uv run ruff check --output-format=github .
          uv run ruff format --check .

      - name: Type check with ty
        run: uv run ty check

      - name: Test with PyTest
        run: uv run pytest --color=yes --cov=acpype --cov=tests --cov-report=xml

      - name: Check platform wheels build and stay under the PyPI size limit
        if: matrix.python-version == '3.12'
        run: uv run python scripts/build_wheels.py --out-dir dist

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  release:
    needs: check-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Get current date
        id: vdate
        run: echo "adate=$(date +'%Y.%-m.%-d')" >> $GITHUB_OUTPUT

      - name: Create tag
        # will only create a new tag if the commit message contains 'new_tag' on master
        if: github.ref == 'refs/heads/master' && contains(github.event.head_commit.message, 'new_tag')
        uses: actions/github-script@v8
        with:
          script: |
            github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: "refs/tags/${{ steps.vdate.outputs.adate }}",
              sha: context.sha
            })

      - name: Create Release
        # will only create a new release if the commit message contains 'new_release' on master
        if: github.ref == 'refs/heads/master' && contains(github.event.head_commit.message, 'new_release')
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vdate.outputs.adate }}
          name: Release ${{ steps.vdate.outputs.adate }}
          draft: false
          prerelease: false
