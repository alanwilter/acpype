name: release

# Fallback path: publishes when a GitHub Release is created by a person.
#
# The normal path is a commit to main whose message contains `new_release`, which makes
# check_acpype.yml tag, release *and* publish in a single run. That exists because a
# Release created by GITHUB_TOKEN raises no event capable of starting another workflow,
# so the automated path can never rely on this one firing.
#
# The tag always points at a commit that already passed check_acpype on main, so the
# suite is not re-run here. Re-running it would mean nesting a workflow call, which
# cannot request more permissions than its caller grants.

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ github.ref_name }}
    permissions:
      contents: write
      id-token: write
    secrets: inherit
