name: publish

# Everything that happens once a version is tagged: PyPI, the Release assets and the
# Docker image. Kept as a reusable workflow so both release paths share one definition
# without either calling the other.

on:
  workflow_call:
    inputs:
      tag:
        description: "Version tag to publish, e.g. 2026.9.2"
        required: true
        type: string
  # Recovery path: a Release created by GITHUB_TOKEN fires no event, and an event
  # cannot be replayed, so publishing an existing tag has to be startable by hand.
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to publish, e.g. 2026.9.2"
        required: true
        type: string

jobs:
  pypi:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: pypi
      url: https://pypi.org/p/acpype
    permissions:
      # contents for the checkout and the Release upload, id-token for OIDC.
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          # Version comes from `required-version` in pyproject.toml.
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install project
        run: uv sync --locked

      - name: Check the version matches the tag
        run: |
          version=$(uv run python -c "import acpype; print(acpype.__version__)")
          echo "package version: ${version}   tag: ${{ inputs.tag }}"
          if [ "${version}" != "${{ inputs.tag }}" ]; then
            echo "::error::package version ${version} does not match tag ${{ inputs.tag }}"
            exit 1
          fi

      - name: Build the distributions
        # Two platform wheels plus a slim sdist: a combined wheel is ~129 MB and a full
        # sdist ~121 MB, both over PyPI's 100 MB per-file limit. The script fails if
        # anything creeps back over it.
        run: uv run python scripts/build_dists.py --out-dir dist

      - name: List distributions
        run: ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Attach the distributions to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" dist/* --clobber

  docker:
    # After PyPI, so a release that failed to publish leaves no image behind.
    needs: [pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: dockerhub
      url: https://hub.docker.com/r/acpype/acpype
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        # Docker Hub has no OIDC equivalent, so this one needs stored credentials.
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          # The vendored AmberTools is linux x86_64 only.
          platforms: linux/amd64
          push: true
          tags: |
            acpype/acpype:latest
            acpype/acpype:${{ inputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
