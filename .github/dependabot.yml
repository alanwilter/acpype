version: 2

updates:
  # The absence of this entry is why the workflow actions drifted years behind:
  # nothing was watching them, so `actions/checkout` sat on v2 while v7 shipped.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"

  # Python dependencies are managed by uv, so Dependabot must read uv.lock rather
  # than the old poetry.lock it used to bump.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build(deps)"
    # Dependabot picks versions on its own 3-day default cooldown, but `uv lock` honours
    # `exclude-newer = "7 days"` in pyproject.toml and refuses anything younger, so every
    # release 3-7 days old failed with "can't resolve your Python dependency files".
    # One day over uv's window absorbs any rounding between the two clocks.
    cooldown:
      default-days: 8
    groups:
      dev-dependencies:
        dependency-type: "development"
        patterns:
          - "*"
